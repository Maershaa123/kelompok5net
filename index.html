<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIVENET 5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <img src="logo.png" class="logo">
    <div class="subtitle">Kelompok 5 • Teknik Komputer</div>

    <div class="running-text"><span>🚀 Surf, Chat, Game, TikTokan Semua Lancar • FIVENET 5 Jadi Spot Hits Kamu 😎📱✨</span></div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="openTab(event,'member')">Member</button>
        <button class="tab" onclick="openTab(event,'voucher')">Voucher</button>
        <button class="tab" onclick="openTab(event,'daftar')">Daftar Voucher</button>
    </div>

    <!-- Member Login -->
    <div id="member" class="section active">
        <div class="card">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button class="btn btn-login">Login Member</button>
            <div class="reset-link">
                <a href="#">Lupa Password?</a> | <a href="#">Reset Akun</a>
            </div>
        </div>
    </div>

    <!-- Input Voucher -->
    <div id="voucher" class="section">
        <div class="card">
            <input type="text" placeholder="Masukkan Kode Voucher">
            <button class="btn btn-voucher">Gunakan Voucher</button>
        </div>
    </div>

    <!-- Daftar Voucher -->
    <div id="daftar" class="section">
        <!-- Voucher contoh -->
        <div class="voucher">
            <h4>⏱️ Voucher 12 Jam</h4>
            <p>Harga : Rp 2.000</p>
            <div class="pay">
                <a href="#" class="dana" onclick="payApp('dana')">DANA</a>
                <a href="#" class="gopay" onclick="payApp('gopay')">GoPay</a>
                <a href="#" class="ovo" onclick="payApp('ovo')">OVO</a>
                <a href="#" class="qris" onclick="payApp('qris')">QRIS</a>
            </div>
            <div class="confirmation">
                <a href="#" class="lanjut">Konfirmasi Pembayaran / Kirim Bukti</a>
                <div class="batal">Batal</div>
            </div>
        </div>
        <!-- Voucher lainnya bisa ditambah sama format ini -->
    </div>

    <!-- Hubungi CS -->
    <a class="wa" href="#" id="hubungiCS">💬 Hubungi CS / Admin</a>

    <footer>© 2026 FIVENET 5</footer>
</div>

<script>
function openTab(event, tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
}

function payApp(method){
    let linkApp = '#';
    switch(method){
        case 'dana': linkApp='dana://home'; break;
        case 'gopay': linkApp='gopay://'; break;
        case 'ovo': linkApp='ovo://'; break;
        case 'qris': linkApp='https://linkqris.com'; break;
    }
    window.open(linkApp,'_blank');

    let confirmation = event.target.closest('.voucher').querySelector('.confirmation');
    confirmation.style.display='block';

    let lanjut = confirmation.querySelector('.lanjut');
    let batal = confirmation.querySelector('.batal');

    lanjut.onclick=function(e){
        e.preventDefault();
        let pesan=encodeURIComponent(
            `Halo Admin FIVENET 5,\nSaya sudah melakukan pembayaran melalui ${method.toUpperCase()}.\nBerikut bukti pembayaran saya.\nMohon diproses. Terima kasih.`
        );
        window.open(`https://wa.me/6281937016932?text=${pesan}`,'_blank');
    }

    batal.onclick=function(){confirmation.style.display='none';}
}

document.getElementById('hubungiCS').onclick = function(e){
    e.preventDefault();
    let pesanCS = encodeURIComponent(
        "Halo CS FIVENET 5,\nSaya ingin bertanya / butuh bantuan terkait voucher."
    );
    window.open(`https://wa.me/6281937016932?text=${pesanCS}`,'_blank');
}
</script>

</body>
</html>
